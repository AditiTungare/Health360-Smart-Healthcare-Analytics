
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Health360</title>

<style>
:root {
    --bg: #061426;
    --navy: #0b2037;
    --cyan: #4ce3db;
    --text: #f2f8ff;
    --muted: #a7bdd0;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 22px 7%;
    background: #061426;
    border-bottom: 1px solid #1b4055;
}
.logo {
    font-size: 27px;
    font-weight: 800;
}
.logo span { color: var(--cyan); }

nav {
    display: flex;
    gap: 26px;
    flex-wrap: wrap;
}
nav a {
    color: #dcebf6;
    text-decoration: none;
    font-weight: 500;
}
nav a:hover { color: var(--cyan); }

.hero {
    text-align: center;
    padding: 70px 20px 45px;
    background:
        radial-gradient(circle at 50% 0%, #0d566866, transparent 55%),
        linear-gradient(135deg, #061426, #0a2642);
}
.eyebrow {
    color: var(--cyan);
    letter-spacing: 2px;
    font-size: 12px;
    font-weight: 700;
}
.hero h1 {
    font-size: clamp(32px, 5vw, 54px);
    margin: 18px 0;
}
.hero h1 span { color: var(--cyan); }
.hero p {
    color: var(--muted);
    line-height: 1.8;
    max-width: 720px;
    margin: auto;
}
.container {
    max-width: 1450px;
    margin: auto;
    padding: 35px 20px 70px;
}
.dashboard-wrapper {
    padding: 12px;
    border: 1px solid #2b5267;
    border-radius: 18px;
    background: #102941;
    box-shadow: 0 0 45px #4ce3db12;
}
.dashboard-frame {
    width: 100%;
    height: 850px;
    border: 0;
    border-radius: 10px;
    background: white;
}
footer {
    text-align: center;
    padding: 28px;
    color: var(--muted);
    border-top: 1px solid #24465b;
}
@media(max-width: 600px) {
    header { justify-content: center; }
    nav { justify-content: center; gap: 18px; }
    .hero { padding: 50px 20px 30px; }
    .dashboard-frame { height: 650px; }
    .dashboard-wrapper { padding: 6px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">Health<span>360</span></div>
    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/story">Stories</a>
    </nav>
</header>

<section class="hero">
    <div class="eyebrow">INTERACTIVE DATA VISUALIZATION</div>

    <h1>Healthcare <span>Analytics Dashboard</span></h1>

    <p>
        Explore patient demographics, clinical indicators,
        lifestyle factors, and chronic disease trends
        through interactive Tableau visualizations.
    </p>
</section>

<main class="container">
    <div class="dashboard-wrapper">
        <iframe
            class="dashboard-frame"
            title="Health360 Tableau Dashboard"
            src="https://public.tableau.com/views/Heath360-SmartHealthcareAnalytics/Dashboard4?:showVizHome=no"
            loading="lazy">
        </iframe>
    </div>
</main>

<footer>
    Health360 | Smart Healthcare Analytics
</footer>

</body>
</html>
